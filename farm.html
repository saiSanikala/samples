<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Farm Dashboard</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-200 flex justify-center py-6">

  <!-- Phone Container -->
  <div class="w-[390px] bg-white rounded-[32px] overflow-hidden shadow-xl relative">

    <!-- Header -->
    <div class="bg-emerald-600 text-white px-5 py-4 flex justify-between items-center">
      <h1 class="text-lg font-semibold">Dashboard</h1>

      <div class="relative">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2"
             viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2a2 2 0 01-.6 1.4L4 17h5m6 0a3 3 0 01-6 0"/>
        </svg>
        <span class="absolute -top-1 -right-1 bg-red-500 text-xs text-white rounded-full px-1">2</span>
      </div>
    </div>

    <!-- Welcome Banner -->
    <div class="bg-gradient-to-r from-emerald-100 to-emerald-50 px-5 py-6">
      <h2 class="text-xl font-semibold text-gray-800">Welcome back!</h2>
      <p class="text-sm text-gray-600">Manage your farm efficiently</p>
      <div class="mt-4 h-24 rounded-xl bg-emerald-200"></div>
    </div>

    <!-- Grid Menu -->
    <div class="p-5 grid grid-cols-3 gap-4">

      <!-- Card -->
      <div class="border rounded-xl p-4 text-center">
        <svg class="w-10 h-10 mx-auto text-emerald-600" fill="currentColor" viewBox="0 0 24 24">
          <rect x="3" y="10" width="4" height="10" rx="1"/>
          <rect x="10" y="6" width="4" height="14" rx="1"/>
          <rect x="17" y="3" width="4" height="17" rx="1"/>
        </svg>
        <p class="mt-2 text-sm font-medium">Dashboard</p>
      </div>

      <div class="border rounded-xl p-4 text-center">
        <svg class="w-10 h-10 mx-auto text-emerald-600" fill="currentColor" viewBox="0 0 24 24">
          <path d="M4 6h12a4 4 0 014 4v4a2 2 0 01-2 2h-1v2h-2v-2H9v2H7v-2H4a2 2 0 01-2-2V8a2 2 0 012-2z"/>
          <circle cx="7" cy="10" r="1.5"/>
          <circle cx="13" cy="10" r="1.5"/>
        </svg>
        <p class="mt-2 text-sm font-medium">Cattle</p>
      </div>

      <div class="border rounded-xl p-4 text-center">
        <svg class="w-10 h-10 mx-auto text-emerald-600" fill="currentColor" viewBox="0 0 24 24">
          <path d="M8 2h8l-1 4v14a2 2 0 01-2 2h-2a2 2 0 01-2-2V6L8 2z"/>
        </svg>
        <p class="mt-2 text-sm font-medium">Milk Production</p>
      </div>

      <div class="border rounded-xl p-4 text-center">
        <svg class="w-10 h-10 mx-auto text-emerald-600" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 21s-6-4.35-9-8.5C.5 8.5 3.5 5 7 6.5 9 7.5 10 9.5 12 10c2-0.5 3-2.5 5-3.5 3.5-1.5 6.5 2 4 6-3 4.15-9 8.5-9 8.5z"/>
        </svg>
        <p class="mt-2 text-sm font-medium">Health History</p>
      </div>

      <div class="border rounded-xl p-4 text-center">
        <svg class="w-10 h-10 mx-auto text-emerald-600" fill="currentColor" viewBox="0 0 24 24">
          <path d="M20 4l-4-4-2 2 1 1-8 8-1-1-2 2 4 4 2-2-1-1 8-8 1 1 2-2z"/>
        </svg>
        <p class="mt-2 text-sm font-medium">Vaccinations</p>
      </div>

      <div class="border rounded-xl p-4 text-center">
        <svg class="w-10 h-10 mx-auto text-emerald-600" fill="currentColor" viewBox="0 0 24 24">
          <path d="M3 10h18v2H3z"/>
          <path d="M5 12v7h14v-7"/>
        </svg>
        <p class="mt-2 text-sm font-medium">Feed Management</p>
      </div>

      <div class="border rounded-xl p-4 text-center">
        <svg class="w-10 h-10 mx-auto text-emerald-600" fill="currentColor" viewBox="0 0 24 24">
          <path d="M4 6h12a4 4 0 014 4v4h-4l-4 4-4-4H4z"/>
        </svg>
        <p class="mt-2 text-sm font-medium">Breeding</p>
      </div>

      <div class="border rounded-xl p-4 text-center">
        <svg class="w-10 h-10 mx-auto text-emerald-600" fill="currentColor" viewBox="0 0 24 24">
          <path d="M6 2h9l5 5v15a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2z"/>
        </svg>
        <p class="mt-2 text-sm font-medium">Reports</p>
      </div>

      <div class="border rounded-xl p-4 text-center">
        <svg class="w-10 h-10 mx-auto text-emerald-600" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 8a4 4 0 100 8 4 4 0 000-8z"/>
          <path d="M2 12l2-1 1-3-1-2 2-2 2 1 3-1 1-2h4l1 2 3 1 2-1 2 2-1 2 1 3 2 1v4l-2 1-1 3 1 2-2 2-2-1-3 1-1 2h-4l-1-2-3-1-2 1-2-2 1-2-1-3-2-1z"/>
        </svg>
        <p class="mt-2 text-sm font-medium">Settings</p>
      </div>

    </div>

    <!-- Bottom Navigation -->
    <div class="absolute bottom-0 left-0 right-0 bg-white border-t flex justify-around py-3 text-xs">
      <span class="text-emerald-600">Home</span>
      <span class="text-gray-400">Analytics</span>
      <span class="text-gray-400">Tasks</span>
      <span class="text-gray-400">Profile</span>
    </div>

    <div class="h-14"></div>
  </div>

</body>
</html>
