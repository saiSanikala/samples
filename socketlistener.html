<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WebSocket Connector</title>
  <style>
    html,body { height:100%; margin:0; font-family:Inter, Roboto, Arial, sans-serif; background:#f5f7fb; color:#111827; }
    .center { height:100%; display:flex; align-items:center; justify-content:center; }
    .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 6px 20px rgba(20,30,60,0.08); width:520px; max-width:calc(100% - 32px); position:relative; }
    .field { display:flex; gap:8px; margin-bottom:12px; }
    input[type="text"] { flex:1; padding:10px 12px; border-radius:8px; border:1px solid #e6e9ef; outline:none; font-size:14px; }
    button { padding:10px 12px; border-radius:8px; border:none; background:#2563eb; color:white; cursor:pointer; font-weight:600; }
    button[disabled] { opacity:0.6; cursor:not-allowed; }
    .status { font-size:13px; margin-bottom:8px; }
    .log { height:320px; overflow:auto; border-radius:8px; border:1px solid #eceef3; padding:12px; background:#fbfdff; font-family:Consolas, Menlo, monospace; font-size:13px; color:#0f1724; }
    .msg { margin:6px 0; padding:8px 10px; border-radius:6px; background:#eef2ff; display:inline-block; max-width:100%; word-break:break-word; }
    .meta { font-size:12px; color:#6b7280; margin-bottom:10px; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <div class="center">
    <div class="card" role="region" aria-label="WebSocket connector">
      <!-- Input area -->
      <div id="inputArea">
        <div class="meta">String to append as <code>?id=...</code></div>
        <div class="field">
          <input id="idInput" type="text" placeholder="enter id (example: chatroom1)" />
          <button id="connectBtn">Connect</button>
        </div>

        <div class="status" id="status">Status: <strong id="state">disconnected</strong></div>
      </div>

      <!-- Message area (hidden until connected) -->
      <div id="messageArea" class="hidden">
        <div class="meta">Connected — incoming messages</div>
        <div id="log" class="log" aria-live="polite"></div>
        <div style="margin-top:10px; display:flex; gap:8px; justify-content:flex-end;">
          <button id="disconnectBtn">Disconnect</button>
        </div>
      </div>

    </div>
  </div>
  <script>
    window.isClient = true;
  </script>
  <script type='text/javascript' src='./gagv.js'></script>
  <script>
    (function () {
      // const baseUrlEl = document.getElementById('baseUrl');
      const idEl = document.getElementById('idInput');
      const connectBtn = document.getElementById('connectBtn');
      const disconnectBtn = document.getElementById('disconnectBtn');
      const stateEl = document.getElementById('state');
      const logEl = document.getElementById('log');
      const inputArea = document.getElementById('inputArea');
      const messageArea = document.getElementById('messageArea');

      function connect() {
        const rawId = idEl.value.trim();
        if (!rawId) {
          alert('Enter the id string to append as a query parameter.');
          return;
        }
        connectToSocket(rawId);
        return;
        }
        connectBtn.addEventListener('click', connect);
    })();
  </script>
</body>
</html>
