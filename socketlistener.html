<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WebSocket Connector</title>
  <style>
    html,body { height:100%; margin:0; font-family:Inter, Roboto, Arial, sans-serif; background:#f5f7fb; color:#111827; }
    .center { height:100%; display:flex; align-items:center; justify-content:center; }
    .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 6px 20px rgba(20,30,60,0.08); width:520px; max-width:calc(100% - 32px); position:relative; }
    .field { display:flex; gap:8px; margin-bottom:12px; }
    input[type="text"] { flex:1; padding:10px 12px; border-radius:8px; border:1px solid #e6e9ef; outline:none; font-size:14px; }
    button { padding:10px 12px; border-radius:8px; border:none; background:#2563eb; color:white; cursor:pointer; font-weight:600; }
    button[disabled] { opacity:0.6; cursor:not-allowed; }
    .status { font-size:13px; margin-bottom:8px; }
    .log { height:320px; overflow:auto; border-radius:8px; border:1px solid #eceef3; padding:12px; background:#fbfdff; font-family:Consolas, Menlo, monospace; font-size:13px; color:#0f1724; }
    .msg { margin:6px 0; padding:8px 10px; border-radius:6px; background:#eef2ff; display:inline-block; max-width:100%; word-break:break-word; }
    .meta { font-size:12px; color:#6b7280; margin-bottom:10px; }
    .hidden { display:none !important; }
  </style>
  <script type='text/javascript' src='./gagv.js'></script>
</head>
<body>
  <div class="center">
    <div class="card" role="region" aria-label="WebSocket connector">
      <!-- Input area -->
      <div id="inputArea">
        <div class="meta">String to append as <code>?id=...</code></div>
        <div class="field">
          <input id="idInput" type="text" placeholder="enter id (example: chatroom1)" />
          <button id="connectBtn">Connect</button>
        </div>

        <div class="status" id="status">Status: <strong id="state">disconnected</strong></div>
      </div>

      <!-- Message area (hidden until connected) -->
      <div id="messageArea" class="hidden">
        <div class="meta">Connected — incoming messages</div>
        <div id="log" class="log" aria-live="polite"></div>
        <div style="margin-top:10px; display:flex; gap:8px; justify-content:flex-end;">
          <button id="disconnectBtn">Disconnect</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    (function () {
      // const baseUrlEl = document.getElementById('baseUrl');
      const idEl = document.getElementById('idInput');
      const connectBtn = document.getElementById('connectBtn');
      const disconnectBtn = document.getElementById('disconnectBtn');
      const stateEl = document.getElementById('state');
      const logEl = document.getElementById('log');
      const inputArea = document.getElementById('inputArea');
      const messageArea = document.getElementById('messageArea');

      let ws = null;

      function appendLog(message, meta) {
        const time = new Date().toLocaleTimeString();
        const container = document.createElement('div');
        const m = document.createElement('div');
        m.className = 'msg';
        m.textContent = message;
        const t = document.createElement('div');
        t.style.fontSize = '11px';
        t.style.color = '#6b7280';
        t.textContent = (meta ? meta + ' · ' : '') + time;
        container.appendChild(m);
        container.appendChild(t);
        logEl.appendChild(container);
        logEl.scrollTop = logEl.scrollHeight;
      }

      function setState(s) {
        stateEl.textContent = s;
      }

      function buildUrl(base, key, value) {
        try {
          const url = new URL(base);
          url.searchParams.set(key, value);
          return url.toString();
        } catch (e) {
          const sep = base.includes('?') ? '&' : '?';
          return base + sep + encodeURIComponent(key) + '=' + encodeURIComponent(value);
        }
      }

      function showMessageArea() {
        inputArea.classList.add('hidden');
        messageArea.classList.remove('hidden');
      }

      function showInputArea() {
        inputArea.classList.remove('hidden');
        messageArea.classList.add('hidden');
      }

      function disconnect(notify) {
        if (ws) {
          try { ws.close(1000, 'client disconnect'); } catch (e) {}
          ws = null;
        }
        setState('disconnected');
        showInputArea();
        if (notify) {
          alert('Socket disconnected');
        }
      }

      function connect() {
        // const rawBase = baseUrlEl.value.trim();
        const rawId = idEl.value.trim();
        // if (!rawBase) {
        //   alert('Enter a base WebSocket URL (e.g. wss://my-app.onrender.com/).');
        //   return;
        // }
        if (!rawId) {
          alert('Enter the id string to append as a query parameter.');
          return;
        }
        connectToId(rawId);
        return;
        const wsUrl = buildUrl(rawBase, 'id', rawId);
        // prevent double connect
        if (ws && ws.readyState === WebSocket.OPEN) {
          appendLog('Already connected', 'info');
          return;
        }

        setState('connecting');
        connectBtn.disabled = true;

        try {
          ws = new WebSocket(wsUrl);

          ws.addEventListener('open', () => {
            setState('connected');
            connectBtn.disabled = false;
            showMessageArea();
            appendLog('Connection opened', 'info');
          });

          ws.addEventListener('message', async (ev) => {
  let payload = ev.data;

  // Blob (common when server sends binary frames)
  if (payload instanceof Blob) {
    // modern browsers support blob.text()
    payload = await payload.text();
  } else if (payload instanceof ArrayBuffer) {
    // binary ArrayBuffer -> convert to string
    payload = new TextDecoder().decode(new Uint8Array(payload));
  } else if (payload instanceof Uint8Array) {
    payload = new TextDecoder().decode(payload);
  }

  // Try parse JSON, otherwise keep as string
  let parsed = payload;
  if (typeof payload === 'string') {
    try {
      parsed = JSON.parse(payload);
    } catch (e) {
      // not JSON — keep string
    }
  }

  // display + call handler
  appendLog(typeof payload === 'string' ? payload : JSON.stringify(payload), 'recv');
  try { handleMessage(parsed); } catch (err) { console.error('handleMessage error', err); }
});

          ws.addEventListener('close', (ev) => {
            appendLog('Connection closed (code=' + ev.code + ')', 'info');
            disconnect(true); // show alert
          });

          ws.addEventListener('error', (err) => {
            console.error('WebSocket error', err);
            appendLog('Socket error', 'error');
            // Do not alert on every error; let close handle notification
          });

        } catch (err) {
          appendLog('Failed to create WebSocket: ' + (err.message || err), 'error');
          setState('error');
          connectBtn.disabled = false;
        }
      }

      // Expose a simple send method for convenience
      window.wsSend = function (msg) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          appendLog('Warn: socket not open, cannot send', 'warn');
          return;
        }
        const payload = typeof msg === 'string' ? msg : JSON.stringify(msg);
        ws.send(payload);
        appendLog(payload, 'sent');
      };

      // The message handler called for every incoming message.
      window.handleMessage = function (message) {
        // default: nothing special beyond being displayed. Replace as needed.
        // e.g., parse JSON and update UI: const obj = JSON.parse(message);
        // console.log('handleMessage:', message);
      };

      connectBtn.addEventListener('click', () => connect());
      disconnectBtn.addEventListener('click', () => disconnect(false));

      // Enter key on id input connects
      idEl.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') connect();
      });

      // cleanup on unload
      window.addEventListener('beforeunload', () => {
        if (ws) {
          try { ws.close(1000, 'page unload'); } catch (e) {}
        }
      });

      // auto-fill host convenience
      (function setDefaultHost() {
        try {
          const loc = window.location;
          if (loc.protocol === 'https:') {
            baseUrlEl.value = baseUrlEl.value && baseUrlEl.value !== '' ? baseUrlEl.value : `wss://${loc.host}/`;
          } else if (loc.protocol === 'http:') {
            baseUrlEl.value = baseUrlEl.value && baseUrlEl.value !== '' ? baseUrlEl.value : `ws://${loc.host}/`;
          }
        } catch (e) {}
      })();

    })();
  </script>
</body>
</html>
