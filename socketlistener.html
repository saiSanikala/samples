<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WebSocket Connector</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      font-family: Inter, Roboto, Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .center {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 6px 20px rgba(20, 30, 60, 0.08);
      width: 520px;
      max-width: calc(100% - 32px);
      position: relative;
    }

    .field {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #e6e9ef;
      outline: none;
      font-size: 14px;
    }

    button {
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    button[disabled] {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      font-size: 13px;
      margin-bottom: 8px;
    }

    .log {
      height: 320px;
      overflow: auto;
      border-radius: 8px;
      border: 1px solid #eceef3;
      padding: 12px;
      background: #fbfdff;
      font-family: Consolas, Menlo, monospace;
      font-size: 13px;
      color: #0f1724;
    }

    .msg {
      margin: 6px 0;
      padding: 8px 10px;
      border-radius: 6px;
      background: #eef2ff;
      display: inline-block;
      max-width: 100%;
      word-break: break-word;
    }

    .meta {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 10px;
    }

    .hidden {
      display: none !important;
    }

    /* Sliding Panel */
    #sidePanel {
      position: fixed;
      top: 0;
      left: -50vw;
      /* hidden initially */
      width: 50vw;
      height: 100vh;
      background: #e0e0e0;
      box-shadow: 4px 0 12px rgba(0, 0, 0, 0.3);
      z-index: 999999;
      padding: 20px;
      box-sizing: border-box;
      transition: left 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    #sidePanel.open {
      left: 0;
    }

    /* Arrow toggle button (aligned to panel edge) */
    #panelToggle {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      left: 0;
      /* default when panel closed */
      width: 28px;
      height: 48px;
      background: #333;
      color: white;
      border-radius: 0 6px 6px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      z-index: 1000000;
      transition: left 0.3s ease;
    }

    /* Buttons at top */
    .buttons-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .buttons-row button {
      padding: 6px 12px;
      background: #f5f5f5;
      border: 1px solid #444;
      border-radius: 4px;
      white-space: nowrap;
      cursor: pointer;
      color: black;
    }

    /* Bottom input area */
    .bottom-input {
      margin-top: auto;
      border-top: 1px solid #bbb;
      padding-top: 12px;
    }

    .bottom-input input {
      width: 10%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #666;
    }

    #playGround {
      width: 50%;
      height: 95%;
      margin-top: 2%;

    }

    .textarea-wrapper {
      position: relative;
      display: inline-block;
      /* shrink to textarea width */
      height: 50%;
    }

    .info-icon {
      position: absolute;
      top: 2%;
      left: 48%;
      cursor: pointer;
    }

    .info-icon .tooltip {
      display: none;
      position: absolute;
      left: 25px;
      top: -5px;
      background: #333;
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      max-width: 450px;
      /* limit width so long lines wrap */
      white-space: normal;
      /* allow wrapping */
      z-index: 99;
    }

    .info-icon:hover .tooltip {
      display: block;
    }

    .steps {
      top: 50%;
      position: absolute;
    }

    /* Labels */
    .label-container {
      margin-top: 3%;
    }

    .label {
      display: inline-block;
      background: #e4e4e4;
      padding: 5px 10px;
      border-radius: 15px;
      margin-right: 5px;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .label .close-btn {
      margin-left: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #labelInput {
      width: 50%;
    }
  </style>
</head>

<body>
  <div class="center">
    <div class="card" role="region" aria-label="WebSocket connector">
      <!-- Input area -->
      <div id="inputArea">
        <div class="meta">String to append as <code>?id=...</code></div>
        <div class="field">
          <input id="idInput" type="text" placeholder="enter id (example: chatroom1)" />
          <button id="connectBtn">Connect</button>
        </div>

        <div class="status" id="status">Status: <strong id="state">disconnected</strong></div>
      </div>

      <!-- Message area (hidden until connected) -->
      <div id="messageArea" class="hidden">
        <div class="meta">Connected — incoming messages</div>
        <div id="log" class="log" aria-live="polite"></div>
      </div>

    </div>
  </div>
  <div id="sidePanel">
    <div class="buttons-row">
      <button onclick="continueWatch()">continue watch</button>
      <button>subscribe nudge</button>
      <button>settings</button>
      <button>details</button>
    </div>
    <div class="textarea-wrapper">
      <textarea id="playGround" type="textarea"></textarea>
      <span class="info-icon">
        ℹ️
        <span class="tooltip">
          NOTE: case sensitive<br>
          start 2<br>
          press ArrowDown/ArrowUp/ArrowRight/ArrowLeft/Enter/Backspace<br>
          wait 10000<br>
          end
        </span>
      </span>
    <button class='steps' onclick="formatPlayGroundSteps()">run steps</button>
    </div>
      <!-- Input + Add + Done -->
      <div class="label-controls">
        <input id="labelInput" type="text" placeholder="event name => press enter" />
        <button onclick="finishLabels()">Done</button>
      </div>

      <!-- Where labels appear -->
      <div id="labelContainer" class="label-container"></div>
    <div class="bottom-input">
      <span>Iterations: </span><input id="iterations" type="number" placeholder="1" value=1>
    </div>
  </div>

  <div id="panelToggle">&gt;</div>


  <script>
    window.isClient = true;
  </script>
  <script type='text/javascript' src='./gagv.js'></script>
  <script>
    const panel = document.getElementById('sidePanel');
    const toggle = document.getElementById('panelToggle');

    function updateArrow() {
      var overlay = document.getElementById('__compare_overlay') || '';
      if (panel.classList.contains('open')) {
        toggle.textContent = '<';
        toggle.style.left = "50vw";   // move arrow to panel's right edge
        if (overlay)
          overlay.style.display = 'none';
      } else {
        toggle.textContent = '>';
        toggle.style.left = "0";      // stick to screen edge
        if (overlay)
          overlay.style.display = 'block';
      }
    }

    toggle.addEventListener('click', () => {
      panel.classList.toggle('open');
      updateArrow();
    });

    // updateArrow();

    // End of slider

    function continueWatch() {
      var iterations = document.getElementById('iterations').value || 1;
      postMessageViaSocket({ type: 'test', method: 'continue_watch', iterations: iterations });
    }

    (function () {
      // const baseUrlEl = document.getElementById('baseUrl');
      const idEl = document.getElementById('idInput');
      const connectBtn = document.getElementById('connectBtn');

      function connect() {
        const rawId = idEl.value.trim();
        if (!rawId) {
          alert('Enter the id string to append as a query parameter.');
          return;
        }
        connectToSocket(rawId);
        return;
      }
      connectBtn.addEventListener('click', connect);
    })();



    var labels = [];

    function addLabel() {
      var input = document.getElementById("labelInput");
      var value = input.value.trim();
      if (!value) return;

      labels.push(value);
      renderLabels();

      input.value = ""; // clear input
    }

    function removeLabel(index) {
      labels.splice(index, 1);
      renderLabels();
    }

    function renderLabels() {
      var container = document.getElementById("labelContainer");
      container.innerHTML = "";

      for (var i = 0; i < labels.length; i++) {
        var div = document.createElement("div");
        div.className = "label";
        div.innerHTML =
          labels[i] +
          ' <span class="close-btn" onclick="removeLabel(' +
          i +
          ')">&times;</span>';

        container.appendChild(div);
      }
    }

    function finishLabels() {
      console.log("Final labels:", labels);
      window.ignoreEvents = labels || [];
      postMessageViaSocket({ type: 'ignore', msg: window.ignoreEvents });
    }

    // Add label when pressing Enter
    document
      .getElementById("labelInput")
      .addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          addLabel();
        }
      });
  </script>
</body>

</html>
